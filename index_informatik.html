<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informatik – Interaktive Lernmaterialien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-dark: #0C447C;
    --blue-mid: #185FA5;
    --blue-light: #E6F1FB;
    --blue-border: #B5D4F4;
    --gray-bg: #F8F7F4;
    --gray-border: #D3D1C7;
    --gray-text: #5F5E5A;
    --text-main: #1a1917;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #f5f3ef;
    color: var(--text-main);
    min-height: 100vh;
  }

  .page {
    width: min(1200px, 100%);
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; color: var(--gray-text); text-decoration: none; margin-bottom: 1.5rem; }
  .back-link:hover { color: var(--blue-mid); }

  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--text-main);
    padding-bottom: 1.4rem;
    margin-bottom: 2.5rem;
    gap: 1.5rem;
  }
  .site-header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gray-text);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .site-header h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 2.2rem;
    font-weight: 600;
    line-height: 1.15;
  }
  .site-header .subtitle {
    margin-top: 0.6rem;
    font-size: 14px;
    color: var(--gray-text);
    line-height: 1.6;
    max-width: 580px;
  }
  .site-logo {
    max-height: 160px;
    width: auto;
    align-self: flex-start;
  }

  .placeholder {
    background: var(--gray-bg);
    border: 1.5px dashed var(--gray-border);
    border-radius: 10px;
    padding: 3rem 2rem;
    text-align: center;
    color: var(--gray-text);
    font-size: 14px;
    line-height: 1.7;
  }

  .site-footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--gray-border);
    font-size: 12px;
    color: var(--gray-text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  @media (max-width: 600px) {
    .page { padding: 2rem 1.25rem 4rem; }
    .site-header h1 { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<div class="page">

  <a href="index.html" class="back-link">‹ Alle Fächer</a>

  <!-- ── Site Header ── -->
  <header class="site-header">
    <div>
      <p class="eyebrow">Interaktive Lernmaterialien · Informatik</p>
      <h1>Informatik</h1>
      <p class="subtitle">Interaktive Materialien für den Informatikunterricht am Paul-Klee-Gymnasium Overath.</p>
    </div>
    <img src="assets/pkg_hauptlogo_web_kleiner.png" alt="Logo" class="site-logo">
  </header>

  <div class="placeholder">
    Inhalte folgen in Kürze.
  </div>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <span>Informatik · Interaktive Lernmaterialien</span>
    <span>Gehostet auf GitHub Pages</span>
  </footer>

</div>
</body>
</html>
