<style>
  :root {
    --blue-mid: #185FA5;
    --green-mid: #16A34A;
    --green-light: #F0FDF4;
    --gray-bg: #F8F7F4;
    --gray-border: #D3D1C7;
    --gray-text: #5F5E5A;
    --text-main: #1a1917;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #f5f3ef;
    color: var(--text-main);
    min-height: 100vh;
  }

  .page {
    width: min(1100px, 100%);
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; color: var(--gray-text); text-decoration: none; margin-bottom: 1.5rem; }
  .back-link:hover { color: var(--green-mid); }

  .header { border-bottom: 2px solid var(--text-main); padding-bottom: 1.2rem; margin-bottom: 2rem; }
  .header .kurs { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-text); font-weight: 500; margin-bottom: 0.4rem; }
  .header h1 { font-family: 'Source Serif 4', serif; font-size: 2rem; font-weight: 600; line-height: 1.2; }

  .sim-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .sim-card {
    display: flex; align-items: center; gap: 1rem;
    background: white; border: 1px solid var(--gray-border); border-left: 3px solid var(--green-mid);
    border-radius: 8px; padding: 0.85rem 1.1rem;
    text-decoration: none; color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .sim-card:hover { border-color: var(--green-mid); box-shadow: 0 2px 12px rgba(22,163,74,0.10); transform: translateY(-1px); }
  .sim-icon { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; background: var(--green-light); }
  .sim-text { flex: 1; min-width: 0; }
  .sim-title { font-size: 14.5px; font-weight: 500; }
  .sim-desc { font-size: 12px; color: var(--gray-text); margin-top: 0.15rem; line-height: 1.5; }
  .arrow { color: var(--gray-border); font-size: 16px; flex-shrink: 0; transition: color 0.15s; }
  .sim-card:hover .arrow { color: var(--green-mid); }

  .site-footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--gray-border);
    font-size: 12px;
    color: var(--gray-text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  @media (max-width: 600px) {
    .page { padding: 2rem 1.25rem 4rem; }
    .header h1 { font-size: 1.7rem; }
  }
</style>
</head>

<div class="page">

  <div class="header">

    <h1>Übungen &amp; Projekte</h1>
  </div>

  <div class="sim-list">

    <a href="info_ef_uebungen/java_musikplayer.html" class="sim-card">
      <div class="sim-icon">🎵</div>
      <div class="sim-text">
        <div class="sim-title">Java-Projekt: Musikplayer</div>
      </div>
      <span class="arrow">›</span>

  </div>

  <footer class="site-footer">
    <span>Informatik · Interaktive Lernmaterialien</span>
    <span>Gehostet auf GitHub Pages</span>
  </footer>

</div>
