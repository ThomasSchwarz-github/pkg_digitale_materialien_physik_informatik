<!DOCTYPE html>
<html lang="de">
<head>

<title>Informatik EF – Einführungsphase</title>

<style>
  :root {
    --blue-dark: #0C447C;
    --blue-mid: #185FA5;
    --blue-light: #E6F1FB;
    --gray-bg: #F8F7F4;
    --gray-border: #D3D1C7;
    --gray-text: #5F5E5A;
    --text-main: #1a1917;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #f5f3ef;
    color: var(--text-main);
    min-height: 100vh;
  }

  .page {
    width: min(1100px, 100%);
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; color: var(--gray-text); text-decoration: none; margin-bottom: 1.5rem; }
  .back-link:hover { color: var(--blue-mid); }

  .header { border-bottom: 2px solid var(--text-main); padding-bottom: 1.2rem; margin-bottom: 2rem; }
  .header .kurs { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-text); font-weight: 500; margin-bottom: 0.4rem; }
  .header h1 { font-family: 'Source Serif 4', serif; font-size: 2rem; font-weight: 600; line-height: 1.2; }
  .header .meta { margin-top: 0.5rem; font-size: 13px; color: var(--gray-text); }

  .placeholder {
    background: var(--gray-bg);
    border: 1.5px dashed var(--gray-border);
    border-radius: 10px;
    padding: 3rem 2rem;
    text-align: center;
    color: var(--gray-text);
    font-size: 14px;
  }

  .site-footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--gray-border);
    font-size: 12px;
    color: var(--gray-text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  @media (max-width: 600px) {
    .page { padding: 2rem 1.25rem 4rem; }
    .header h1 { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<div class="page">

  <a href="index_informatik.html" class="back-link">‹ Zurück zur Übersicht</a>

  <div class="header">
    <div class="kurs">Informatik · Jahrgangsstufe EF</div>

  <div class="placeholder">
    Inhalte folgen in Kürze.
  </div>

  <footer class="site-footer">
