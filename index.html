<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktive Lernmaterialien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-dark: #0C447C;
    --blue-mid: #185FA5;
    --blue-light: #E6F1FB;
    --blue-border: #B5D4F4;
    --green-dark: #14532D;
    --green-mid: #16A34A;
    --green-light: #F0FDF4;
    --green-border: #86EFAC;
    --gray-bg: #F8F7F4;
    --gray-border: #D3D1C7;
    --gray-text: #5F5E5A;
    --text-main: #1a1917;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #f5f3ef;
    color: var(--text-main);
    min-height: 100vh;
  }

  .page {
    width: min(1200px, 100%);
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* ── Header ── */
  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--text-main);
    padding-bottom: 1.4rem;
    margin-bottom: 2.5rem;
    gap: 1.5rem;
  }
  .site-header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gray-text);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .site-header h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 2.2rem;
    font-weight: 600;
    line-height: 1.15;
  }
  .site-header .subtitle {
    margin-top: 0.6rem;
    font-size: 14px;
    color: var(--gray-text);
    line-height: 1.6;
    max-width: 580px;
  }
  .site-logo {
    max-height: 160px;
    width: auto;
    align-self: flex-start;
  }

  /* ── Fach-Karten ── */
  .fach-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-top: 1rem;
  }
  @media (max-width: 600px) {
    .fach-grid { grid-template-columns: 1fr; }
    .site-header h1 { font-size: 1.7rem; }
    .page { padding: 2rem 1.25rem 4rem; }
  }

  .fach-card {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: white;
    border: 1px solid var(--gray-border);
    border-radius: 12px;
    padding: 2rem 1.75rem;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .fach-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .fach-card--physik {
    border-left: 4px solid var(--blue-mid);
  }
  .fach-card--physik:hover { border-color: var(--blue-mid); }

  .fach-card--informatik {
    border-left: 4px solid var(--green-mid);
  }
  .fach-card--informatik:hover { border-color: var(--green-mid); }

  .fach-icon {
    font-size: 2.5rem;
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
  }
  .fach-card--physik    .fach-icon { background: var(--blue-light); }
  .fach-card--informatik .fach-icon { background: var(--green-light); }

  .fach-text { flex: 1; }
  .fach-title {
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .fach-desc {
    font-size: 13px;
    color: var(--gray-text);
    line-height: 1.6;
  }

  .fach-arrow {
    font-size: 20px;
    color: var(--gray-border);
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .fach-card:hover .fach-arrow { color: var(--text-main); }

  /* ── Footer ── */
  .site-footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--gray-border);
    font-size: 12px;
    color: var(--gray-text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
</style>
</head>
<body>
<div class="page">

  <!-- ── Site Header ── -->
  <header class="site-header">
    <div>
      <p class="eyebrow">Paul-Klee-Gymnasium Overath</p>
      <h1>Digitale Materialien zur Unterrichtsergänzung</h1>
    </div>
    <img src="assets/pkg_hauptlogo_web_kleiner.png" alt="Logo" class="site-logo">
  </header>

  <div class="fach-grid">

    <a href="index_physik.html" class="fach-card fach-card--physik">
      <div class="fach-icon">⚛️</div>
      <div class="fach-text">
        <div class="fach-title">Physik</div>
      </div>
      <span class="fach-arrow">›</span>
    </a>

    <a href="index_informatik.html" class="fach-card fach-card--informatik">
      <div class="fach-icon">💻</div>
      <div class="fach-text">
        <div class="fach-title">Informatik</div>
      </div>
      <span class="fach-arrow">›</span>
    </a>

  </div>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <span>Interaktive Lernmaterialien · Paul-Klee-Gymnasium Overath</span>
    <span>Gehostet auf GitHub Pages</span>
  </footer>

</div>
</body>
</html>
