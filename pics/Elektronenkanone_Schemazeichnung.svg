<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="950" viewBox="0 0 1850 950" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1850" height="950" fill="white"/>
<defs>
<marker id="arrowBeam" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#1565C0"/>
</marker>
<marker id="arrowSmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#B45309"/>
</marker>
</defs>

<!-- Title -->
<text x="60" y="55" font-size="38" font-weight="bold" fill="#1a1a1a">Elektronenkanone – Prinzipskizze</text>

<!-- Beschleunigungsspannungsquelle U_A: reale Drahtverbindung zu Kathode und Anode -->
<text x="640" y="125" font-size="26" font-weight="bold" fill="#1565C0" text-anchor="middle">Beschleunigungsspannung U<tspan font-size="18" baseline-shift="sub">A</tspan> (zwischen Glühkathode und Anode, z. B. 300 V)</text>

<!-- Zuleitung zur Anode -->
<line x1="1020" y1="180" x2="1020" y2="280" stroke="#374151" stroke-width="4"/>

<!-- Spannungsquelle U_A (Gleichspannung, Batteriesymbol) im Verbindungsdraht -->
<line x1="260" y1="180" x2="620" y2="180" stroke="#374151" stroke-width="4"/>
<line x1="660" y1="180" x2="1020" y2="180" stroke="#374151" stroke-width="4"/>
<line x1="620" y1="167" x2="620" y2="193" stroke="#374151" stroke-width="9"/>
<line x1="660" y1="150" x2="660" y2="210" stroke="#374151" stroke-width="3"/>
<text x="620" y="240" font-size="24" font-weight="bold" fill="#1565C0" text-anchor="middle">–</text>
<text x="660" y="240" font-size="24" font-weight="bold" fill="#B91C1C" text-anchor="middle">+</text>

<!-- Glaskolben (Vakuum) -->
<rect x="150" y="280" width="1500" height="380" rx="60" ry="60" fill="#F5F6F8" stroke="#9AA0A6" stroke-width="5"/>
<text x="760" y="610" font-size="26" fill="#9AA0A6" text-anchor="middle" font-style="italic">Vakuum (evakuierter Glaskolben)</text>

<!-- Zuleitung zur Kathode: führt ungehindert in den Glaskolben hinein bis zum oberen Eckpunkt des Heizspannungsstromkreises
     (wird bewusst NACH dem Glaskolben-Rechteck gezeichnet, damit sie dessen Füllfläche nicht verdeckt) -->
<line x1="260" y1="180" x2="260" y2="410" stroke="#374151" stroke-width="4"/>
<circle cx="260" cy="410" r="7" fill="#374151"/>

<!-- Glühkathode / Heizwendel (um 62px nach rechts verschoben, damit die untere Zuleitung senkrecht zur Wechselspannungsquelle verläuft) -->
<polyline points="392,410 420,427 392,444 420,461 392,478 420,495 392,512 420,529" stroke="#E65100" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="425" y="340" font-size="22" font-weight="bold" fill="#E65100" text-anchor="middle">Glühkathode (Heizwendel)</text>

<!-- Zuleitungen zur Heizspannungsquelle: eigener, in sich geschlossener Wechselstromkreis durch die Glühkathode -->
<polyline points="392,410 260,410 260,760" stroke="#374151" stroke-width="4" fill="none"/>
<line x1="420" y1="529" x2="420" y2="760" stroke="#374151" stroke-width="4"/>

<!-- Heizspannungsquelle: Wechselspannungssymbol (Kreis mit Sinuskurve) -->
<line x1="260" y1="760" x2="260" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="420" y1="760" x2="420" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="260" y1="800" x2="308" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="372" y1="800" x2="420" y2="800" stroke="#374151" stroke-width="4"/>
<circle cx="340" cy="800" r="32" fill="white" stroke="#374151" stroke-width="3"/>
<path d="M312,800 Q326,772 340,800 Q354,828 368,800" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="340" y="862" font-size="25" font-weight="bold" fill="#374151" text-anchor="middle">Heizspannung U<tspan font-size="17" baseline-shift="sub">H</tspan> (Wechselspannung ≈ 6 V)</text>

<!-- Glühelektrischer Effekt: austretende Elektronen an der Drahtoberfläche (um 62px nach rechts verschoben, mit der Glühwendel) -->
<circle cx="452" cy="415" r="12" fill="#2E8B4F"/><rect x="443" y="412" width="18" height="5" fill="white"/>
<line x1="464" y1="412" x2="484" y2="398" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>
<text x="487" y="392" font-size="14" fill="#1a1a1a">e⁻</text>

<circle cx="462" cy="452" r="12" fill="#2E8B4F"/><rect x="453" y="449" width="18" height="5" fill="white"/>
<line x1="474" y1="452" x2="498" y2="458" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>

<circle cx="450" cy="488" r="12" fill="#2E8B4F"/><rect x="441" y="485" width="18" height="5" fill="white"/>
<line x1="461" y1="493" x2="480" y2="512" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>

<circle cx="466" cy="522" r="12" fill="#2E8B4F"/><rect x="457" y="519" width="18" height="5" fill="white"/>
<line x1="478" y1="527" x2="502" y2="535" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>
<text x="507" y="540" font-size="14" fill="#1a1a1a">e⁻</text>

<!-- Wehneltzylinder (um 62px nach rechts verschoben, gleicher Abstand zur Glühwendel wie zuvor) -->
<rect x="532" y="380" width="40" height="50" fill="#78716C"/>
<rect x="532" y="510" width="40" height="50" fill="#78716C"/>
<text x="605" y="352" font-size="22" font-weight="bold" fill="#57534E" text-anchor="start">Wehneltzylinder</text>
<line x1="572" y1="400" x2="605" y2="400" stroke="#57534E" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="605" y1="400" x2="605" y2="352" stroke="#57534E" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Anode -->
<rect x="1000" y="280" width="40" height="160" fill="#9CA3AF" stroke="#4B5563" stroke-width="2"/>
<rect x="1000" y="500" width="40" height="160" fill="#9CA3AF" stroke="#4B5563" stroke-width="2"/>
<text x="1060" y="362" font-size="23" font-weight="bold" fill="#374151" text-anchor="start">Anode (A)</text>
<line x1="1055" y1="352" x2="1015" y2="352" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Elektronenstrahl -->
<line x1="572" y1="470" x2="1780" y2="470" stroke="#1565C0" stroke-width="5" stroke-dasharray="16 10" marker-end="url(#arrowBeam)"/>
<circle cx="650" cy="470" r="10" fill="#2E8B4F"/><rect x="642" y="467.5" width="16" height="5" fill="white"/>
<circle cx="1250" cy="470" r="10" fill="#2E8B4F"/><rect x="1242" y="467.5" width="16" height="5" fill="white"/>
<text x="1360" y="428" font-size="25" font-weight="bold" fill="#1565C0" text-anchor="middle">Elektronenstrahl</text>

<!-- Legende -->
<circle cx="1250" cy="750" r="16" fill="#2E8B4F"/>
<rect x="1241" y="747" width="18" height="6" fill="white"/>
<text x="1280" y="758" font-size="25" fill="#1a1a1a" text-anchor="start">Elektron</text>
</svg>
