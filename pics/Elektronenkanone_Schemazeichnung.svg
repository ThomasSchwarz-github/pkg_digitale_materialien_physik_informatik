<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="950" viewBox="0 0 1850 950" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1850" height="950" fill="white"/>
<defs>
<marker id="arrowBeam" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#1565C0"/>
</marker>
<marker id="arrowSmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#B45309"/>
</marker>
</defs>

<!-- Title -->
<text x="60" y="55" font-size="38" font-weight="bold" fill="#1a1a1a">Elektronenkanone – Prinzipskizze</text>
<text x="60" y="88" font-size="20" fill="#6b7280">Erzeugung und Beschleunigung eines Elektronenstrahls im Vakuum</text>

<!-- Beschleunigungsspannung (Klammer zwischen Kathode und Anode) -->
<text x="667" y="150" font-size="23" font-weight="bold" fill="#1565C0" text-anchor="middle">Beschleunigungsspannung U<tspan font-size="15" baseline-shift="sub">A</tspan></text>
<text x="667" y="176" font-size="15" fill="#1565C0" text-anchor="middle">(zwischen Glühkathode und Anode, z. B. 300 V)</text>
<line x1="344" y1="205" x2="1020" y2="205" stroke="#1565C0" stroke-width="3"/>
<line x1="344" y1="195" x2="344" y2="215" stroke="#1565C0" stroke-width="3"/>
<line x1="1020" y1="195" x2="1020" y2="215" stroke="#1565C0" stroke-width="3"/>
<line x1="344" y1="215" x2="344" y2="280" stroke="#1565C0" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1020" y1="215" x2="1020" y2="280" stroke="#1565C0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="344" y="192" font-size="26" font-weight="bold" fill="#1565C0" text-anchor="middle">–</text>
<text x="1020" y="192" font-size="26" font-weight="bold" fill="#B91C1C" text-anchor="middle">+</text>

<!-- Glaskolben (Vakuum) -->
<rect x="150" y="280" width="1500" height="380" rx="60" ry="60" fill="#F5F6F8" stroke="#9AA0A6" stroke-width="5"/>
<text x="760" y="610" font-size="19" fill="#9AA0A6" text-anchor="middle" font-style="italic">Vakuum (evakuierter Glaskolben)</text>

<!-- Glühkathode / Heizwendel -->
<polyline points="330,410 358,427 330,444 358,461 330,478 358,495 330,512 358,529" stroke="#E65100" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="344" y="325" font-size="20" font-weight="bold" fill="#E65100" text-anchor="middle">Glühkathode</text>
<text x="344" y="347" font-size="14" fill="#E65100" text-anchor="middle">(Heizwendel)</text>

<!-- Zuleitungen zur Heizspannungsquelle -->
<polyline points="330,410 260,410 260,760" stroke="#374151" stroke-width="4" fill="none"/>
<polyline points="358,529 420,529 420,760" stroke="#374151" stroke-width="4" fill="none"/>

<!-- Heizspannungsquelle (Batteriesymbol) -->
<line x1="260" y1="760" x2="260" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="420" y1="760" x2="420" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="260" y1="800" x2="320" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="360" y1="800" x2="420" y2="800" stroke="#374151" stroke-width="4"/>
<line x1="320" y1="778" x2="320" y2="822" stroke="#374151" stroke-width="3"/>
<line x1="360" y1="790" x2="360" y2="810" stroke="#374151" stroke-width="8"/>
<text x="340" y="845" font-size="19" font-weight="bold" fill="#374151" text-anchor="middle">Heizspannung U<tspan font-size="13" baseline-shift="sub">H</tspan> (≈ 6 V)</text>

<!-- Glühelektrischer Effekt: austretende Elektronen an der Drahtoberfläche -->
<circle cx="390" cy="415" r="12" fill="#2E8B4F"/><rect x="381" y="412" width="18" height="5" fill="white"/>
<line x1="402" y1="412" x2="422" y2="398" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>
<text x="425" y="392" font-size="14" fill="#1a1a1a">e⁻</text>

<circle cx="400" cy="452" r="12" fill="#2E8B4F"/><rect x="391" y="449" width="18" height="5" fill="white"/>
<line x1="412" y1="452" x2="436" y2="458" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>

<circle cx="388" cy="488" r="12" fill="#2E8B4F"/><rect x="379" y="485" width="18" height="5" fill="white"/>
<line x1="399" y1="493" x2="418" y2="512" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>

<circle cx="404" cy="522" r="12" fill="#2E8B4F"/><rect x="395" y="519" width="18" height="5" fill="white"/>
<line x1="416" y1="527" x2="440" y2="535" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrowSmall)"/>
<text x="445" y="540" font-size="14" fill="#1a1a1a">e⁻</text>

<!-- Wehneltzylinder -->
<rect x="470" y="380" width="40" height="50" fill="#78716C"/>
<rect x="470" y="510" width="40" height="50" fill="#78716C"/>
<text x="490" y="325" font-size="18" font-weight="bold" fill="#57534E" text-anchor="middle">Wehneltzylinder</text>
<line x1="490" y1="333" x2="490" y2="378" stroke="#57534E" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Anode -->
<rect x="1000" y="280" width="40" height="160" fill="#9CA3AF" stroke="#4B5563" stroke-width="2"/>
<rect x="1000" y="500" width="40" height="160" fill="#9CA3AF" stroke="#4B5563" stroke-width="2"/>
<text x="1060" y="360" font-size="20" font-weight="bold" fill="#374151" text-anchor="start">Anode (A)</text>
<line x1="1055" y1="352" x2="1015" y2="352" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Elektronenstrahl -->
<line x1="510" y1="470" x2="1780" y2="470" stroke="#1565C0" stroke-width="5" stroke-dasharray="16 10" marker-end="url(#arrowBeam)"/>
<circle cx="650" cy="470" r="10" fill="#2E8B4F"/><rect x="642" y="467.5" width="16" height="5" fill="white"/>
<circle cx="1250" cy="470" r="10" fill="#2E8B4F"/><rect x="1242" y="467.5" width="16" height="5" fill="white"/>
<text x="1300" y="430" font-size="22" font-weight="bold" fill="#1565C0" text-anchor="middle">Elektronenstrahl</text>

<text x="1660" y="510" font-size="15" fill="#6b7280" font-style="italic" text-anchor="start">(weiter zur Ablenkeinheit /</text>
<text x="1660" y="528" font-size="15" fill="#6b7280" font-style="italic" text-anchor="start">zum Leuchtschirm)</text>

<!-- Legende -->
<circle cx="1250" cy="750" r="16" fill="#2E8B4F"/>
<rect x="1241" y="747" width="18" height="6" fill="white"/>
<text x="1280" y="756" font-size="19" fill="#1a1a1a" text-anchor="start">Elektron (negative Ladung)</text>
</svg>
